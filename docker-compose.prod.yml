# Production deployment: the app plus a Caddy reverse proxy with automatic HTTPS.
#
# Usage:
#   DOMAIN=anabul.example.com docker compose -f docker-compose.prod.yml up -d --build
#
# The database is not containerised: put DATABASE_URL in .env (Neon, for example).
# .env is read literally for the app container, so a $ in a password hash needs no escaping.
services:
  app:
    build: .
    image: anabul
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # The app sits behind Caddy, so X-Forwarded-* headers can be trusted
      # (Secure cookies and per-IP login throttling).
      TRUST_PROXY: "true"
    expose:
      - "8080"
    networks:
      - anabul

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - app
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN, e.g. DOMAIN=anabul.example.com docker compose -f docker-compose.prod.yml up -d}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - anabul

volumes:
  caddy_data:
  caddy_config:

networks:
  anabul:
